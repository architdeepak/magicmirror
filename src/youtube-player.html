<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' https://www.youtube.com https://s.ytimg.com; frame-src https://www.youtube-nocookie.com https://www.youtube.com; style-src 'unsafe-inline'; connect-src https://www.youtube.com https://www.youtube-nocookie.com; img-src https: data:;">

  <div id="player"></div><div id="notice" role="status">Connecting to YouTube…</div>

</html>
